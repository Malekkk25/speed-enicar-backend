spring.application.name=SPEEDENICAR_PROJET
server.port=8088
app.upload.base-path=uploads/
# --- MONGODB ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/speedenicarthage}
spring.data.mongodb.auto-index-creation=true


# --- MULTIPART / UPLOAD ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- JACKSON ---
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBzcGVlZCBhcHBsaWNhdGlvbiBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# --- UPLOAD STORAGE ---
speed.file.upload-dir=./uploads
speed.file.allowed-types=application/pdf,image/png,image/jpeg,image/jpg

# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# --- LOGGING ---
logging.level.root=INFO
logging.level.tn.enicarthage=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# --- SPRING MAIL ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --- THYMELEAF ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# --- ASYNC ---
speed.async.core-pool-size=4
speed.async.max-pool-size=8
speed.async.queue-capacity=100
speed.async.thread-name-prefix=speed-async-

spring.main.allow-bean-definition-overriding=true

